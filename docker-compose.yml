services:
  api:
    build: .
    ports: ["8000:8000"]
    environment: ["JOB_TRACKER_DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/job_tracker"]
    depends_on: {db: {condition: service_healthy}}
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: job_tracker, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 3s, retries: 10}
volumes: {postgres_data: {}}
