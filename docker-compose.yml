services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_tracker
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d job_tracker"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      JOB_TRACKER_DATABASE_URL: postgresql+psycopg://portfolio:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}@db:5432/job_tracker
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
volumes:
  postgres_data: {}
