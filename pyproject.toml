[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "ai-job-application-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3", "python-dotenv>=1,<2", "python-multipart>=0.0.12,<1"]
[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1"]
demo=["matplotlib>=3.9,<4"]
[tool.hatch.build.targets.wheel]
packages = ["src/job_tracker"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
